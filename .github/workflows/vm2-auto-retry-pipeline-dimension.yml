name: VM2 Auto Retry Pipeline Dimension 0916
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: vm2-auto-retry-pipeline-dimension-job
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          if [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]]; then
            echo VM2_CONTROLLED_FIRST_ATTEMPT_FAILURE
            exit 1
          fi
          echo VM2_RERUN_SUCCESS
