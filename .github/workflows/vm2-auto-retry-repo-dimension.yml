name: VM2 Auto Retry Repo Dimension 0916
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: vm2-auto-retry-repo-dimension-job
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          if [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]]; then
            echo VM2_REPO_DIM_CONTROLLED_FAILURE
            exit 1
          fi
          echo VM2_REPO_DIM_RERUN_SUCCESS
