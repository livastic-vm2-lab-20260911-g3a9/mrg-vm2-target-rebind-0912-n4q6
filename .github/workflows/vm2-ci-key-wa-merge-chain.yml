name: VM2 CI-key crossrepo scope WA merge chain

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub repository-boundary control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code=$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data '{"body":"VM2 controlled source-token sibling boundary canary"}' \
            'https://api.github.com/repos/livastic-vm2-lab-20260911-g3a9/mrg-vm2-qslug-fork-0912-k7p4/issues/184/comments')
          echo "VM2_CHAIN_GITHUB_TARGET_COMMENT=${code}"
          if [ "$code" = 201 ]; then
            comment_id=$(jq -r '.id' "$body_file")
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/livastic-vm2-lab-20260911-g3a9/mrg-vm2-qslug-fork-0912-k7p4/issues/comments/${comment_id}"
          fi
          test "$code" = 403

      - name: Mergify application key validity control
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.VM2_TESTIDENTITY_CI_KEY }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code=$(curl -sS -o "$body_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${MERGIFY_TOKEN}" \
            -H 'Accept: application/json' \
            'https://api.mergify.com/v1/application')
          account=$(jq -r '.account_scope.login // .account.login // .account_scope // empty' "$body_file")
          echo "VM2_CHAIN_MERGIFY_APPLICATION=${code}"
          echo "VM2_CHAIN_MERGIFY_ACCOUNT=${account}"
          test "$code" = 200

      - name: Mergify cross-repository scope write current-boundary probe
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.VM2_TESTIDENTITY_CI_KEY }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code=$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${MERGIFY_TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"scopes":["vm2-ci-key-wa-trigger-20260914"],"all_scopes":false}' \
            'https://api.mergify.com/v1/repos/livastic-vm2-lab-20260911-g3a9/mrg-vm2-qslug-fork-0912-k7p4/commits/c2a3ecabf3f0f1aa38aa64283c50e1cf25d7427e/scopes')
          echo "VM2_CHAIN_MERGIFY_TARGET_SCOPE=${code}"
          test "$code" = 403
