name: VM2 Cross Provider Dimension Probe 0916
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline_mismatch:
    name: vm2-dim-pipeline-mismatch
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]
  branch_sha_mismatch:
    name: vm2-dim-branch-sha-mismatch
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]
