name: VM2 Cross Provider Pipeline Replay 0916
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  trigger:
    name: vm2-cross-provider-pipeline-trigger
    runs-on: ubuntu-latest
    steps:
      - name: Attempt discriminator
        shell: bash
        run: |
          echo "VM2_PIPELINE_TRIGGER_ATTEMPT=$4{GITHUB_RUN_ATTEMPT}"
          if [[ "$4{GITHUB_RUN_ATTEMPT}" == "1" ]]; then
            echo "VM2_PIPELINE_CONTROLLED_FAILURE"
            exit 1
          fi
          echo "VM2_PIPELINE_RERUN_SUCCESS"
  side_effect:
    name: vm2-cross-provider-write-side-effect
    runs-on: ubuntu-latest
    steps:
      - name: Write harmless canary comment
        env:
          GH_TOKEN: $4{{ github.token }}
          ISSUE_NUMBER: "49"
        shell: bash
        run: |
          body="VM2_PIPELINE_SIDE_EFFECT attempt=$4{GITHUB_RUN_ATTEMPT} run=$4{GITHUB_RUN_ID}"
          jq -n --arg body "$4body" '{body:$4body}' > /tmp/vm2-comment.json
          curl --fail-with-body -sS             -X POST             -H "Authorization: Bearer $4GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             --data-binary @/tmp/vm2-comment.json             "https://api.github.com/repos/livastic-vm2-lab-20260911-g3a9/mrg-vm2-target-rebind-0912-n4q6/issues/$4ISSUE_NUMBER/comments" >/dev/null
