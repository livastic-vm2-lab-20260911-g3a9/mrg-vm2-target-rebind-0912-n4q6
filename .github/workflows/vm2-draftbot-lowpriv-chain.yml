name: VM2 Draft Bot Low-Priv Code Chain
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
jobs:
  actor-gated-untrusted-code:
    if: >-
      github.actor == 'livastic-vm2-primary-20260911' &&
      github.event.pull_request.base.ref == 'vm2-draftbot-external-base-0915' &&
      startsWith(github.event.pull_request.title, 'merge queue: checking')
    runs-on: ubuntu-latest
    env:
      CANARY: ${{ secrets.VM2_DRAFTBOT_EXTERNAL_CANARY }}
    steps:
      - name: Checkout synthetic PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Execute queued contributor payload in actor-gated secret context
        shell: bash
        run: bash ./vm2-lowpriv-payload.sh
