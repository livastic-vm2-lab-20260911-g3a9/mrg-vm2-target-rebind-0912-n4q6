name: VM2 Draft Bot Actor-Gated Secret Chain
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
jobs:
  actor-gated-secret-context:
    if: >-
      github.actor == 'livastic-vm2-secondary-20260911' &&
      github.event.pull_request.base.ref == 'vm2-draftbot-chain-base-0915' &&
      startsWith(github.event.pull_request.title, 'merge queue: checking')
    runs-on: ubuntu-latest
    env:
      CANARY: ${{ secrets.VM2_DRAFTBOT_CANARY }}
    steps:
      - name: Prove actor-gated secret context without revealing the secret
        shell: bash
        run: |
          test -n "$CANARY"
          echo 'VM2_SECRET_CONTEXT_PRESENT'
