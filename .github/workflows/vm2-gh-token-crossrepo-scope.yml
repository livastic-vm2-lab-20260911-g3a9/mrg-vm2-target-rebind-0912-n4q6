name: VM2 GitHub Token Mergify Scope Boundary
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare GitHub and Mergify repository boundaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: livastic-vm2-lab-20260911-g3a9/mrg-vm2-target-rebind-0912-n4q6
          SIBLING_REPO: livastic-vm2-lab-20260911-g3a9/mrg-vm2-qslug-fork-0912-k7p4
          SIBLING_SHA: 8f5912d7975697bb6090f0892d40cb04672c1cb3
        run: |
          set -u
          auth=(-H "Authorization: Bearer ${GH_TOKEN}")
          accept=(-H "Accept: application/vnd.github+json")

          self_json=$(mktemp)
          self_code=$(curl -sS -o "$self_json" -w '%{http_code}' -X POST \
            "${auth[@]}" "${accept[@]}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${SOURCE_REPO}/issues/13/comments" \
            -d "{\"body\":\"VM2_GITHUB_TOKEN_SELF_CONTROL_${GITHUB_RUN_ID}\"}")
          self_delete='not-created'
          if [ "$self_code" = '201' ]; then
            self_id=$(python3 - "$self_json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: print(json.load(f)['id'])
          PY
            )
            self_delete=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              "${auth[@]}" "${accept[@]}" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${SOURCE_REPO}/issues/comments/${self_id}")
          fi

          sibling_json=$(mktemp)
          sibling_code=$(curl -sS -o "$sibling_json" -w '%{http_code}' -X POST \
            "${auth[@]}" "${accept[@]}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${SIBLING_REPO}/issues/94/comments" \
            -d "{\"body\":\"VM2_GITHUB_TOKEN_SIBLING_CONTROL_${GITHUB_RUN_ID}\"}")
          sibling_delete='not-created'
          if [ "$sibling_code" = '201' ]; then
            sibling_id=$(python3 - "$sibling_json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: print(json.load(f)['id'])
          PY
            )
            sibling_delete=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              "${auth[@]}" "${accept[@]}" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${SIBLING_REPO}/issues/comments/${sibling_id}")
          fi

          self_mergify=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            "https://api.mergify.com/v1/repos/${SOURCE_REPO}/commits/${GITHUB_SHA}/scopes" \
            "${auth[@]}" -H 'Content-Type: application/json' \
            -d '{"scopes":["vm2-gh-token-self-control"],"all_scopes":false}')

          sibling_mergify=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            "https://api.mergify.com/v1/repos/${SIBLING_REPO}/commits/${SIBLING_SHA}/scopes" \
            "${auth[@]}" -H 'Content-Type: application/json' \
            -d '{"scopes":["vm2-gh-token-sibling-20260914"],"all_scopes":false}')

          self_scope_cleanup='not-needed'
          if [ "$self_mergify" = '204' ]; then
            self_scope_cleanup=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              "https://api.mergify.com/v1/repos/${SOURCE_REPO}/commits/${GITHUB_SHA}/scopes" \
              "${auth[@]}" -H 'Content-Type: application/json' \
              -d '{"scopes":[],"all_scopes":false}')
          fi

          echo "VM2_GH_TOKEN_SOURCE_GITHUB_COMMENT=${self_code}"
          echo "VM2_GH_TOKEN_SOURCE_GITHUB_DELETE=${self_delete}"
          echo "VM2_GH_TOKEN_SIBLING_GITHUB_COMMENT=${sibling_code}"
          echo "VM2_GH_TOKEN_SIBLING_GITHUB_DELETE=${sibling_delete}"
          echo "VM2_GH_TOKEN_SOURCE_MERGIFY_SCOPE=${self_mergify}"
          echo "VM2_GH_TOKEN_SOURCE_MERGIFY_CLEANUP=${self_scope_cleanup}"
          echo "VM2_GH_TOKEN_SIBLING_MERGIFY_SCOPE=${sibling_mergify}"

