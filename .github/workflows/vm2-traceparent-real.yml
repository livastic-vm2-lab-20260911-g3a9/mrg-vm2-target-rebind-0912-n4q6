name: VM2 traceparent collision target
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest-mergify
        run: python -m pip install pytest-mergify==2026.9.11.1
      - name: Upload target canary
        env:
          MERGIFY_TOKEN: ${{ secrets.VM2_TRACEPARENT_CI_KEY }}
          MERGIFY_TRACEPARENT: 00-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee-ffffffffffffffff-01
        run: |
          cat > /tmp/test_vm2_trace_target.py <<'PY'
          def test_vm2_trace_target_failure_row():
              assert False
          PY
          pytest -q -p pytest_mergify /tmp/test_vm2_trace_target.py
