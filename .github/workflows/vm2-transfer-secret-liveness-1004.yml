name: VM2 transfer secret liveness 1004
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe inherited Mergify credential without printing it
        env:
          MERGIFY_TOKEN: ${{ secrets.VM2_TESTIDENTITY_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MERGIFY_TOKEN:-}" ]; then
            echo 'VM2_TRANSFER_SECRET_PRESENT=0'
            exit 0
          fi
          echo 'VM2_TRANSFER_SECRET_PRESENT=1'
          code="$(curl -sS -o /tmp/app.json -w '%{http_code}' -H "Authorization: Bearer ${MERGIFY_TOKEN}" https://api.mergify.com/v1/application)"
          echo "VM2_TRANSFER_SECRET_APPLICATION_STATUS=${code}"
          if [ "$code" = 200 ]; then
            jq -r 'to_entries[] | select(.key == "scope" or .key == "account_scope" or .key == "id" or .key == "name") | "VM2_TRANSFER_APP_\(.key|ascii_upcase)=\(.value)"' /tmp/app.json
          fi
