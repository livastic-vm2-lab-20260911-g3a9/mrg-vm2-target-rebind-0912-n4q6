name: VM2 workflow_dispatch provenance contract 0916
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: vm2-workflow-dispatch-contract
    runs-on: ubuntu-latest
    steps:
      - name: Dump bounded GitHub event contract
        shell: bash
        run: |
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "BASE_REF=${GITHUB_BASE_REF}"
          echo "HEAD_REF=${GITHUB_HEAD_REF}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo "SHA=${GITHUB_SHA}"
          jq -c '{ref:.ref, inputs:.inputs, repository:.repository.full_name, sender:.sender.login}' "$GITHUB_EVENT_PATH"
