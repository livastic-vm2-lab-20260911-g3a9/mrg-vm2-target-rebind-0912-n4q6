queue_rules:
  - name: vm2-mergebot-freshness
    batch_size: 1
    max_checks_retries: 0
    queue_conditions:
      - base = vm2-mergebot-base-0915
      - title ~= ^VM2_MERGEBOT_FRESHNESS_
    merge_conditions:
      - base = vm2-mergebot-base-0915
      - title ~= ^VM2_MERGEBOT_FRESHNESS_
      - check-success = vm2-mergebot-hold
pull_request_rules: []
